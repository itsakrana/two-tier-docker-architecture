name: Achievements

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'    # 10:30 AM IST daily

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: achievements
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Git identity
        run: |
          git config user.name "itsakrana"
          git config user.email "222025851+itsakrana@users.noreply.github.com"

      - name: Open and merge PRs
        run: |
          COUNT=3
          BASE=$(git symbolic-ref --short HEAD)

          for i in $(seq 1 $COUNT); do
            BRANCH="auto/$(date -u +%Y%m%d)-$i-$RANDOM"
            git checkout -b "$BRANCH" "$BASE"

            echo "PR $(date -u +%F) #$i $RANDOM" >> pr-log.md
            git add pr-log.md
            git commit -m "docs: update log #$i" \
              -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push origin "$BRANCH"

            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "docs: update log $(date -u +%F) #$i" \
              --body "Automated log update"

            git checkout "$BASE"

            # GitHub needs a few seconds to check mergeability, so retry
            for try in 1 2 3 4 5; do
              sleep 10
              gh pr merge "$BRANCH" --merge --delete-branch && break
            done

            STATE=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || echo MERGED)
            if [ "$STATE" != "MERGED" ]; then
              echo "PR $BRANCH was not merged"; exit 1
            fi

            git pull origin "$BASE"
          done

      # Quickdraw is a one-time badge. Delete this step after you get it.
      - name: Open and close an issue
        run: |
          URL=$(gh issue create --title "Quick check $(date -u +%F)" --body "Opened and closed right away")
          gh issue close "$URL"

      # Heart On Your Sleeve is a one-time badge. Runs only on manual runs.
      - name: Heart the latest issues and PRs
        if: github.event_name == 'workflow_dispatch'
        run: |
          for N in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=5" --jq '.[].number'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$N/reactions" -f content=heart
          done
