name: Heart reactions

on:
  workflow_dispatch:

jobs:
  heart:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: React with heart
        run: |
          for N in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=5" --jq '.[].number'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$N/reactions" -f content=heart
          done
